name: Build ESP32-S3 firmware and test engine

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r engine/requirements.txt
      - run: python -m unittest discover -s engine -p "test_*.py" -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware
          command: idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-rf-tomography-firmware
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
            firmware/build/flasher_args.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32s3-rf-tomography-firmware
          path: firmware-bin
      - uses: softprops/action-gh-release@v2
        with:
          files: firmware-bin/**/*.bin
